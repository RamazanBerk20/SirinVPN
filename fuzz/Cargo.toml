# Outside the main workspace: cargo-fuzz needs a nightly toolchain and sanitizers.
[package]
name = "sirinvpn-fuzz"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
sirinvpn-core = { path = "../crates/core" }
sirinvpn-release = { path = "../crates/release" }
sirinvpn-transport = { path = "../crates/transport" }

[[bin]]
name = "relay_datagram"
path = "fuzz_targets/relay_datagram.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tcp_connection"
path = "fuzz_targets/tcp_connection.rs"
test = false
doc = false
bench = false

[[bin]]
name = "invitation"
path = "fuzz_targets/invitation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "backup"
path = "fuzz_targets/backup.rs"
test = false
doc = false
bench = false

[[bin]]
name = "release"
path = "fuzz_targets/release.rs"
test = false
doc = false
bench = false
