name: Local candidate build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build unsigned engineering packages
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          python3 scripts/record-evidence.py --suite linux-package --output target/remediation-evidence --timeout 6600 --artifact "target/release/bundle/deb/SirinVPN_${version}_amd64.deb" --artifact "target/release/bundle/appimage/SirinVPN_${version}_amd64.AppImage" --signing-category unsigned-engineering -- sh scripts/package-linux-container.sh
          sudo apt-get update
          sudo apt-get install -y p7zip-full binutils
          python3 scripts/check-linux-package.py "target/release/bundle/deb/SirinVPN_${version}_amd64.deb" "target/release/bundle/appimage/SirinVPN_${version}_amd64.AppImage" --output target/remediation-evidence/linux-package-inspection.json
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-evidence-${{ github.sha }}
          path: |
            target/remediation-evidence/linux-package.json
            target/remediation-evidence/linux-package-inspection.json
          if-no-files-found: error
          retention-days: 14
