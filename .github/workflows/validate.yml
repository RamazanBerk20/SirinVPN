name: Validate
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 4
      RUST_TEST_THREADS: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libssl-dev libxdo-dev patchelf shellcheck libxml2-utils ripgrep
          npm install --prefix .cache/ci-tools --ignore-scripts --no-audit --no-fund "$(node -p "require('./apps/desktop/package.json').packageManager")"
          echo "$PWD/.cache/ci-tools/node_modules/.bin" >> "$GITHUB_PATH"
          rustup show active-toolchain
      - run: pnpm --dir apps/desktop install --frozen-lockfile
      - run: python3 scripts/check-workflows.py
      - name: Shared local gates
        run: python3 scripts/record-evidence.py --frozen-source --suite linux-fast --output target/remediation-evidence --timeout 3000 -- sh scripts/test.sh
      - name: Preserve synthetic test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-fast-${{ github.sha }}
          path: |
            target/remediation-evidence/linux-fast.json
            target/remediation-evidence/linux-fast.log
          if-no-files-found: error
          retention-days: 14
  windows-build:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 4
      RUST_TEST_THREADS: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native libraries and service compilation
        shell: pwsh
        run: |
          $SirinNativePerl = 'C:\Strawberry\perl\bin'
          if (Test-Path -LiteralPath "$SirinNativePerl\perl.exe") {
            $env:PATH = "$SirinNativePerl;" + $env:PATH
          }
          python scripts/record-evidence.py --frozen-source --suite windows-native --output target/remediation-evidence --timeout 3300 -- pwsh -File scripts/test-windows.ps1
          exit $LASTEXITCODE
      - name: Preserve native check evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-native-${{ github.sha }}
          path: |
            target/remediation-evidence/windows-native.json
            target/remediation-evidence/windows-native.log
          if-no-files-found: error
          retention-days: 14
