name: Dependency advisories and licenses
# Commits that change dependency inputs must scan clean. New advisories against
# unchanged dependencies are the weekly scan's job, so they do not fail every
# unrelated commit until the lockfile is updated.
on:
  pull_request:
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'vendor/**'
      - 'apps/desktop/package.json'
      - 'apps/desktop/pnpm-lock.yaml'
      - 'apps/desktop/android/gradle.lockfile'
      - 'apps/desktop/android/wireguard/**'
      - 'osv-scanner.toml'
      - 'scripts/check-dependencies.py'
      - 'scripts/check-vendored.py'
      - 'scripts/record-evidence.py'
      - '.github/workflows/dependencies.yml'
  push:
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'vendor/**'
      - 'apps/desktop/package.json'
      - 'apps/desktop/pnpm-lock.yaml'
      - 'apps/desktop/android/gradle.lockfile'
      - 'apps/desktop/android/wireguard/**'
      - 'osv-scanner.toml'
      - 'scripts/check-dependencies.py'
      - 'scripts/check-vendored.py'
      - 'scripts/record-evidence.py'
      - '.github/workflows/dependencies.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'
permissions:
  contents: read
concurrency:
  group: dependencies-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/desktop/android/wireguard/go.mod
          cache: false
      - run: python3 scripts/record-evidence.py --suite dependencies --output target/remediation-evidence --timeout 660 -- python3 scripts/check-dependencies.py --android-lock apps/desktop/android/gradle.lockfile --output target/remediation-evidence/dependencies-osv.json
      - name: Summarize dependency findings
        if: always()
        run: |
          if [ -f target/remediation-evidence/dependencies-osv.md ]; then
            cat target/remediation-evidence/dependencies-osv.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Dependency scan did not complete. See the evidence log; no clean result is claimed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve findings and scanner failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-evidence-${{ github.sha }}
          path: |
            target/remediation-evidence/dependencies.json
            target/remediation-evidence/dependencies.log
            target/remediation-evidence/dependencies-osv.json
            target/remediation-evidence/dependencies-osv.md
          if-no-files-found: error
          retention-days: 14
